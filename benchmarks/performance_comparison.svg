<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="pyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B9BD5"/>
      <stop offset="100%" stop-color="#3A7BBF"/>
    </linearGradient>
    <linearGradient id="cppGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ED7D31"/>
      <stop offset="100%" stop-color="#C55A11"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="420" rx="8" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">
    Tetramer Search Performance: m3_light (Python) vs RNAmotifs2 (C++)
  </text>
  <text x="360" y="50" text-anchor="middle" font-size="11" fill="#888">
    NOVA dataset (4,368 exons) on mm9 | hw=15, min_height=4, pth=0.5
  </text>

  <!-- Chart area: x=100..680, y=70..340 -->
  <!-- Y-axis: time in minutes, max=40 -->

  <!-- Grid lines -->
  <g stroke="#E0E0E0" stroke-width="0.5">
    <line x1="100" y1="70"  x2="680" y2="70"/>
    <line x1="100" y1="103.5" x2="680" y2="103.5"/>
    <line x1="100" y1="137" x2="680" y2="137"/>
    <line x1="100" y1="170.5" x2="680" y2="170.5"/>
    <line x1="100" y1="204" x2="680" y2="204"/>
    <line x1="100" y1="237.5" x2="680" y2="237.5"/>
    <line x1="100" y1="271" x2="680" y2="271"/>
    <line x1="100" y1="304.5" x2="680" y2="304.5"/>
    <line x1="100" y1="340" x2="680" y2="340"/>
  </g>

  <!-- Y-axis -->
  <line x1="100" y1="70" x2="100" y2="340" stroke="#999" stroke-width="1"/>
  <text x="90" y="344" text-anchor="end" font-size="10" fill="#666">0</text>
  <text x="90" y="310" text-anchor="end" font-size="10" fill="#666">5</text>
  <text x="90" y="277" text-anchor="end" font-size="10" fill="#666">10</text>
  <text x="90" y="243" text-anchor="end" font-size="10" fill="#666">15</text>
  <text x="90" y="210" text-anchor="end" font-size="10" fill="#666">20</text>
  <text x="90" y="176" text-anchor="end" font-size="10" fill="#666">25</text>
  <text x="90" y="143" text-anchor="end" font-size="10" fill="#666">30</text>
  <text x="90" y="110" text-anchor="end" font-size="10" fill="#666">35</text>
  <text x="90" y="77"  text-anchor="end" font-size="10" fill="#666">40</text>

  <!-- Y-axis label -->
  <text x="30" y="205" text-anchor="middle" font-size="12" fill="#555" transform="rotate(-90,30,205)">
    Wall-clock time (minutes)
  </text>

  <!-- X-axis -->
  <line x1="100" y1="340" x2="680" y2="340" stroke="#999" stroke-width="1"/>

  <!-- Bars: 5 bars, spacing: bar_w=70, gap=46, start_x=130 -->
  <!-- Python 1 core: 35 min -> y=340-35*6.75=340-236.25=103.75, height=236.25 -->
  <!-- scale: 1 min = (340-70)/40 = 6.75 px -->

  <!-- Bar 1: Python m3_light (1 core) = 35 min -->
  <rect x="130" y="103.75" width="70" height="236.25" rx="3" fill="url(#pyGrad)" filter="url(#shadow)"/>
  <text x="165" y="97" text-anchor="middle" font-size="12" font-weight="bold" fill="#3A7BBF">~35 min</text>
  <text x="165" y="360" text-anchor="middle" font-size="10" fill="#555">Python</text>
  <text x="165" y="373" text-anchor="middle" font-size="9" fill="#888">1 core</text>

  <!-- Bar 2: C++ 1 core = ~17 min (18x speedup at 10 cores, ~2 min; 1 core ~ 17 min) -->
  <rect x="246" y="225.25" width="70" height="114.75" rx="3" fill="url(#cppGrad)" filter="url(#shadow)"/>
  <text x="281" y="219" text-anchor="middle" font-size="12" font-weight="bold" fill="#C55A11">~17 min</text>
  <text x="281" y="360" text-anchor="middle" font-size="10" fill="#555">C++ (1)</text>
  <text x="281" y="373" text-anchor="middle" font-size="9" fill="#888">1 core</text>

  <!-- Bar 3: C++ 4 cores = ~5 min -->
  <rect x="362" y="306.25" width="70" height="33.75" rx="3" fill="url(#cppGrad)" filter="url(#shadow)"/>
  <text x="397" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#C55A11">~5 min</text>
  <text x="397" y="360" text-anchor="middle" font-size="10" fill="#555">C++ (4)</text>
  <text x="397" y="373" text-anchor="middle" font-size="9" fill="#888">4 cores</text>

  <!-- Bar 4: C++ 8 cores = ~2.5 min -->
  <rect x="478" y="323.12" width="70" height="16.88" rx="3" fill="url(#cppGrad)" filter="url(#shadow)"/>
  <text x="513" y="317" text-anchor="middle" font-size="12" font-weight="bold" fill="#C55A11">~2.5 min</text>
  <text x="513" y="360" text-anchor="middle" font-size="10" fill="#555">C++ (8)</text>
  <text x="513" y="373" text-anchor="middle" font-size="9" fill="#888">8 cores</text>

  <!-- Bar 5: C++ 12 cores = ~2 min -->
  <rect x="594" y="326.5" width="70" height="13.5" rx="3" fill="url(#cppGrad)" filter="url(#shadow)"/>
  <text x="629" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#C55A11">~2 min</text>
  <text x="629" y="360" text-anchor="middle" font-size="10" fill="#555">C++ (12)</text>
  <text x="629" y="373" text-anchor="middle" font-size="9" fill="#888">12 cores</text>

  <!-- Legend -->
  <rect x="460" y="70" width="12" height="12" rx="2" fill="url(#pyGrad)"/>
  <text x="478" y="81" font-size="11" fill="#555">m3_light (Python 2)</text>
  <rect x="460" y="88" width="12" height="12" rx="2" fill="url(#cppGrad)"/>
  <text x="478" y="99" font-size="11" fill="#555">rnamotifs_search (C++17 / OpenMP)</text>

  <!-- Speedup annotations -->
  <g font-size="9" fill="#666" font-style="italic">
    <text x="281" y="390" text-anchor="middle">2x vs Python</text>
    <text x="397" y="390" text-anchor="middle">7x vs Python</text>
    <text x="513" y="390" text-anchor="middle">14x vs Python</text>
    <text x="629" y="390" text-anchor="middle">~18x vs Python</text>
  </g>

  <!-- Footnote -->
  <text x="360" y="412" text-anchor="middle" font-size="9" fill="#AAA">
    Measured on NOVA.txt (4,368 exons, mm9 genome). Run examples/run_benchmark.sh to reproduce.
  </text>
</svg>
